name: Deploy Frontend (S3)

on:
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/routes/**'
      - 'src/main.tsx'
      - 'src/router.tsx'
      - 'src/routeTree.gen.ts'
      - 'src/styles.css'
      - 'src/lib/apiClient.ts'
      - 'src/lib/checkoutTip.ts'
      - 'src/lib/customerCancellation.ts'
      - 'src/lib/orderNumber.ts'
      - 'src/lib/paymentMethod.ts'
      - 'src/lib/supabaseClient.ts'
      - 'src/lib/utils.ts'
      - 'src/lib/waitEstimate.ts'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.spa.config.ts'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:spa
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ --delete
